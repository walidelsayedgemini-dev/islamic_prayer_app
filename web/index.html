  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-title" content="islamic_prayer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>islamic_prayer_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- الخطوط العربية الإسلامية الاحترافية: خط الرقعة الأصيل (عارف رقعة)، القاهرة، الأميري، تجوال -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Aref+Ruqaa+Ink:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030e0b;
      overflow: hidden;
      font-family: 'Aref Ruqaa', 'Cairo', 'Amiri', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <script>
    // إزالة كاش المتصفح القديم وإلغاء تسجيل أي ServiceWorker سابق لمنع التعارض مع وضع التطوير
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
