  <title>الفردوس — مواقيت الصلاة والقبلة والأذكار</title>
  <style>
    html, body { margin: 0; padding: 0; background: #030e0b; }
    body { overflow: hidden; font-family: 'Cairo', 'Amiri', 'Tajawal', system-ui, sans-serif; }
    #app-startup { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; overflow: auto; background: #030e0b; color: #eaf2ed; text-align: center; }
    #app-startup .content { max-width: 460px; }
    #app-startup img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; }
    #app-startup h1 { margin: 16px 0 8px; font-size: 28px; color: #e6c65c; }
    #app-startup h2 { font-size: 17px; margin: 0 0 12px; font-weight: 500; }
    #app-startup p { line-height: 1.75; color: #b9cec3; font-size: 14px; }
    #startup-status { display: block; margin-top: 20px; font-size: 15px; }
    #startup-retry { display: none; margin: 16px auto 0; padding: 12px 22px; border: 0; border-radius: 12px; background: #e6c65c; color: #142d22; font: inherit; cursor: pointer; }
    #app-startup noscript { display: block; padding: 12px; color: #fff; }
  </style>
</head>
<body>
  <main id="app-startup" aria-label="بدء تطبيق الفردوس">
    <div class="content">
      <img src="assets/assets/images/palace_jannah_logo.png" alt="شعار الفردوس">
      <h1>الفردوس</h1>
      <h2>مواقيت الصلاة والقبلة والأذكار</h2>
      <p>مواقيت حسب موقعك، سبحة تفاعلية وتقويم هجري، مع خيارات المظهر وحساب الصلاة. تُحفظ تفضيلاتك محليًا في هذا المتصفح.</p>
      <span id="startup-status" role="status" aria-live="polite">جارٍ تحميل التطبيق…</span>
      <button id="startup-retry" type="button">إعادة المحاولة</button>
      <noscript>يتطلب التطبيق تفعيل JavaScript. فعّله في متصفحك ثم أعد تحميل الصفحة.</noscript>
    </div>
  </main>
  <script>
    (() => {
      const startup = document.getElementById('app-startup');
      const status = document.getElementById('startup-status');
      const retry = document.getElementById('startup-retry');
      let ready = false;
      let timer;
      function showFailure(message) {
        if (ready) return;
        status.textContent = message;
        retry.style.display = 'block';
      }
      retry.addEventListener('click', () => location.reload());
      window.addEventListener('flutter-first-frame', () => {
        ready = true;
        clearTimeout(timer);
        startup.remove();
      }, { once: true });
      const probe = document.createElement('canvas');
      const gl = probe.getContext('webgl2') || probe.getContext('webgl');
      if (!gl) {
        showFailure('الرسم غير متاح في هذا المتصفح. افتح الموقع في Chrome أو Edge أو Safari حديث مع دعم WebGL.');
        return;
      }
      timer = setTimeout(() => {
        showFailure('التحميل يستغرق وقتًا أطول من المعتاد. تحقق من اتصالك، أو جرّب متصفحًا حديثًا يدعم WebGL.');
      }, 45000);
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      script.onerror = () => showFailure('تعذّر تحميل التطبيق. تحقق من اتصال الإنترنت ثم أعد المحاولة.');
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
