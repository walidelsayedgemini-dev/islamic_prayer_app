name: islamic_prayer_app
description: "A comprehensive Islamic Flutter application with Prayer Times, Qibla Compass, Smart Tasbih, and Adhan Reminders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # المحرك الفلكي لحساب الصلوات
  adhan: ^2.0.0

  # قراءة حساسات اتجاه القبلة
  flutter_compass: ^0.8.0

  # تحديد الموقع الجغرافي
  geolocator: ^11.0.0

  # تنسيق الوقت والتواريخ
  intl: ^0.20.2

  # تنبيهات الأذان والجدولة الزمنية
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # حفظ التفضيلات محلياً
  shared_preferences: ^2.2.3

  # إدارة الحالة التفاعلية
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
